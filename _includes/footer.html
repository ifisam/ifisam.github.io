{% assign privacy_page = site.pages | where: "ref", "privacy" | where: "lang", lang | first %}
<footer class="pt-5 my-5 text-muted border-top">
  <div class="row">
    <div class="col-md-6 text-end social-media-icons">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="ms-3" rel="me">{% if item.icon == "envelope" %}{{ t.email }}{% else %}{{ item.name }}{% endif %}</a>
      {% endfor %}
      {% if privacy_page %}<a href="{{ site.github.url }}{{ privacy_page.url }}" class="ms-3">{{ t.privacy }}</a>{% endif %}
    </div>
  </div>
</footer>
